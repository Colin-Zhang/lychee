<!doctype html><meta charset="utf-8"><style>@font-face{font-family:"Brush";src:url("./fonts/MaShanZheng.subset.woff2")}body{margin:0;background:#222}</style>
<canvas id="v" width="1920" height="1080"></canvas>
<script type="module">
import { drawMap, MW, MH, P } from "./src/map.js";
await document.fonts.load('40px "Brush"');
const base = document.createElement("canvas"); base.width = MW; base.height = MH; drawMap(base.getContext("2d"));
const v = document.getElementById("v").getContext("2d");
window.view = (cx, cy, z) => { v.setTransform(1,0,0,1,0,0); v.fillStyle="#222"; v.fillRect(0,0,1920,1080); v.setTransform(z,0,0,z,960-cx*z,540-cy*z); v.drawImage(base,0,0); return true; };
window.P = P; window.MW = MW; window.MH = MH; window.ready = true;
</script>
